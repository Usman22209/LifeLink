buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.2.12479018"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
// ✅ Patch to avoid Gradle packaging bug with JNI .so libs in debug/release AARs
gradle.projectsEvaluated {
    subprojects { subproject ->
        if (subproject.name.contains("react-native-reanimated") ||
            subproject.name.contains("react-native-worklets")) {

            subproject.tasks.matching { it.name == "bundleDebugLocalLintAar" }.configureEach {
                enabled = false
            }
            subproject.tasks.matching { it.name == "bundleReleaseLocalLintAar" }.configureEach {
                enabled = false
            }
            subproject.tasks.matching { it.name == "bundleDebugAar" }.configureEach {
                enabled = false
            }
            subproject.tasks.matching { it.name == "bundleReleaseAar" }.configureEach {
                enabled = false
            }
        }
    }
}
